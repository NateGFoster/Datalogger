; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sets the serial monitor speed to 115200 baud
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200  ; Sets the serial monitor speed to 115200 baud
upload_protocol = teensy-cli  ; upload from the command line (no Teensy Loader GUI needed)
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit BNO08x
    adafruit/Adafruit GPS Library

